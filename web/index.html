<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tippr</title>
<meta name="description" content="A very simple, dark tip calculator.">
<meta name="theme-color" content="#101010">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tippr">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
  /* Colors and sizes from the original iOS 7 app (Main.storyboard and its screenshot). */
  :root {
    --bg: #000;
    --bar: #101010;
    --text: #fff;
    --tint: #007aff;
    --tint-pressed: rgba(0, 122, 255, .25);
    --on: #4cd964;
    --key: #656565;
    --key-dark: #3b3b3b;
    --key-gap: #3f3f3f;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--bg);
    color: var(--text);
    font: 17px 'Helvetica Neue', Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .app {
    max-width: 430px;
    height: 100dvh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
  }

  /* Nav bar */
  .bar {
    flex: none;
    background: var(--bar);
    /* Extra top space keeps the title out of the blur iOS 26 draws under the
       status bar. */
    padding: calc(env(safe-area-inset-top) + 24px) 20px 12px;
    text-align: center;
    font-weight: 500;
    line-height: 20px;
  }

  /* Form */
  .form { flex: none; padding: 4px 20px 0; }
  .row { display: flex; align-items: center; justify-content: space-between; }
  .subtotal-row { height: 30px; }
  .subtotal { display: flex; align-items: center; height: 30px; }
  .caret {
    width: 2px;
    height: 20px;
    margin-left: 1px;
    background: var(--tint);
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .segments {
    display: flex;
    height: 29px;
    margin-top: 8px;
    border: 1px solid var(--tint);
    border-radius: 4px;
    overflow: hidden;
  }
  .segment {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--tint);
    font-size: 13px;
    cursor: pointer;
  }
  .segment + .segment { border-left: 1px solid var(--tint); }
  .segment:active { background: var(--tint-pressed); }
  .segment[aria-checked="true"] { background: var(--tint); color: var(--text); }

  .tip-row { height: 21px; margin-top: 8px; }
  .rule { width: 65px; height: 2px; margin: 3px 0 0 auto; background: var(--text); }
  .total-row { height: 22px; margin-top: 4px; }

  .round-row { height: 31px; margin-top: 47px; }
  .switch {
    position: relative;
    width: 51px;
    height: 31px;
    border-radius: 15.5px;
    box-shadow: inset 0 0 0 1.5px var(--tint);
    transition: background .25s, box-shadow .25s;
    cursor: pointer;
  }
  .switch::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 27px;
    height: 27px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 2px 3px rgba(0, 0, 0, .3), 0 0 0 .5px rgba(0, 0, 0, .1);
    transition: transform .25s;
  }
  .switch[aria-checked="true"] { background: var(--on); box-shadow: inset 0 0 0 1.5px var(--on); }
  .switch[aria-checked="true"]::after { transform: translateX(20px); }

  .spacer { flex: 1; min-height: 0; }

  /* Keypad: the iOS 7 dark decimal pad */
  .keys {
    flex: none;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1px;
    padding-top: 1px;
    padding-bottom: env(safe-area-inset-bottom);
    background: var(--key-gap);
  }
  .key {
    height: 53px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--key);
    font-size: 25px;
    font-weight: 300;
    line-height: 1;
    cursor: pointer;
  }
  .key small { font-size: 10px; font-weight: 500; letter-spacing: .1em; margin-top: 1px; }
  .key.dark { background: var(--key-dark); }
  .key:active { background: var(--key-dark); }
  .key.dark:active { background: var(--key); }
  @media (hover: hover) {
    .segment:not([aria-checked="true"]):hover { background: rgba(0, 122, 255, .12); }
    .key:hover { filter: brightness(1.1); }
  }

  /* Controls wrap a hidden <input switch>; tapping it plays the iOS toggle haptic. */
  label input { position: absolute; width: 1px; height: 1px; margin: 0; opacity: 0; overflow: hidden; clip-path: inset(50%); }
</style>
</head>
<body>
<main class="app">
  <header class="bar">Tippr</header>

  <section class="form">
    <div class="row subtotal-row">
      <span>Bill Subtotal</span>
      <span class="subtotal"><span id="subtotal"></span><span class="caret"></span></span>
    </div>
    <div class="segments" id="segments" role="radiogroup" aria-label="Tip amount"></div>
    <div class="row tip-row"><span>Tip</span><span id="tip">$0.00</span></div>
    <div class="rule"></div>
    <div class="row total-row"><span>Bill Total</span><span id="total">$0.00</span></div>
    <div class="row round-row">
      <span>Round bill up?</span>
      <label class="switch" id="round" role="switch" aria-checked="false" aria-label="Round bill up"><input type="checkbox" switch tabindex="-1"></label>
    </div>
  </section>

  <div class="spacer"></div>

  <section class="keys" id="keys"></section>
</main>

<script>
const TIPS = [
  { name: 'Cheapass', percent: 15 },
  { name: 'Alright', percent: 18 },
  { name: 'Awesome', percent: 20 },
];

const state = { subtotal: '', percent: 18, roundUp: false };

const $ = id => document.getElementById(id);
const dollars = cents => '$' + (cents / 100).toFixed(2);

// --- Model -----------------------------------------------------------------
// Same rules as TipCalculatorModel.swift, in whole cents so the rounding is exact:
// the tip rounds up to the cent, and "round up" lifts the total to the next dollar
// and makes the tip the difference.
const ceilDiv = (a, b) => Math.floor((a + b - 1) / b);

function toCents(text) {
  const [whole, frac = ''] = text.split('.');
  return (parseInt(whole, 10) || 0) * 100 + (parseInt(frac.padEnd(2, '0'), 10) || 0);
}

function calculate() {
  const subtotal = toCents(state.subtotal);
  const tip = ceilDiv(subtotal * state.percent, 100);
  let total = subtotal + tip;
  if (state.roundUp) total = ceilDiv(total, 100) * 100;
  return { tip: total - subtotal, total };
}

// --- Input -----------------------------------------------------------------
function press(key) {
  let s = state.subtotal;
  if (key === 'back') s = s.slice(0, -1);
  else if (key === '.') { if (!s.includes('.')) s += '.'; }
  else if (/\.\d\d$/.test(s)) return; // cents only
  else if (s === '0') s = key;
  else if (s.replace('.', '').length < 8) s += key;
  state.subtotal = s;
  render();
}

// Controls are labels around a hidden <input switch>. Safari has no vibration API,
// but when a finger toggles a switch, iOS 18+ plays its toggle haptic. Flipping one
// from code does not tick, so the tap has to land on the switch's label.
function onToggle(label, handler) {
  label.querySelector('input').addEventListener('change', e => {
    e.target.blur(); // so Space on a keyboard doesn't re-trigger the last control
    navigator.vibrate?.(10); // Android
    handler();
  });
}

const KEYS = [
  ['1', ''], ['2', 'ABC'], ['3', 'DEF'],
  ['4', 'GHI'], ['5', 'JKL'], ['6', 'MNO'],
  ['7', 'PQRS'], ['8', 'TUV'], ['9', 'WXYZ'],
  ['.', ''], ['0', ''], ['back', ''],
];
const BACK_ICON = '<svg width="23" height="17" viewBox="0 0 23 17"><path d="M7 0H21a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H7L0 8.5Z" fill="#fff"/><path d="M10.5 5l7 7M17.5 5l-7 7" stroke="#3b3b3b" stroke-width="1.6" stroke-linecap="round"/></svg>';

for (const [k, letters] of KEYS) {
  const key = document.createElement('label');
  key.className = 'key' + (k === '.' || k === 'back' ? ' dark' : '');
  key.innerHTML = (k === 'back' ? BACK_ICON : k) + (letters ? `<small>${letters}</small>` : '') +
    '<input type="checkbox" switch tabindex="-1">';
  key.setAttribute('role', 'button');
  key.setAttribute('aria-label', k === 'back' ? 'Delete' : k === '.' ? 'Decimal point' : k);
  onToggle(key, () => press(k));
  $('keys').append(key);
}

const segments = TIPS.map(({ name, percent }) => {
  const seg = document.createElement('label');
  seg.className = 'segment';
  seg.setAttribute('role', 'radio');
  seg.setAttribute('aria-label', `${name}, ${percent}%`);
  seg.innerHTML = name + '<input type="checkbox" switch tabindex="-1">';
  onToggle(seg, () => { state.percent = percent; render(); });
  $('segments').append(seg);
  return seg;
});

onToggle($('round'), () => { state.roundUp = !state.roundUp; render(); });

// --- Render ----------------------------------------------------------------
function render() {
  const { tip, total } = calculate();
  $('subtotal').textContent = state.subtotal;
  $('tip').textContent = dollars(tip);
  $('total').textContent = dollars(total);
  segments.forEach((seg, i) => seg.setAttribute('aria-checked', TIPS[i].percent === state.percent));
  $('round').setAttribute('aria-checked', state.roundUp);
}

// Hardware keyboard (handy on a laptop).
window.addEventListener('keydown', e => {
  if (/^[0-9.]$/.test(e.key)) press(e.key);
  else if (e.key === 'Backspace') press('back');
  else if (e.key === 'Escape') { state.subtotal = ''; render(); }
});

// iOS only applies :active styles when a touch listener exists.
document.addEventListener('touchstart', () => {}, { passive: true });

render();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
