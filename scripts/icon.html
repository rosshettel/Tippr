<!DOCTYPE html>
<!--
  The 1024×1024 app icon: a "$" over the app's tip slider, set at 20%.
  Render it, then resize it for web/icons/:
    chrome="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
    "$chrome" --headless=new --hide-scrollbars --window-size=1024,1024 --virtual-time-budget=5000 \
      --screenshot=/tmp/icon.png "file://$PWD/scripts/icon.html"
    sips -s format png -z 180 180 /tmp/icon.png --out web/icons/apple-touch-icon.png
    sips -s format png -z 192 192 /tmp/icon.png --out web/icons/icon-192.png
    sips -s format png -z 512 512 /tmp/icon.png --out web/icons/icon-512.png
-->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; }
  /* Colors from web/index.html. */
  body {
    position: relative;
    background: radial-gradient(circle at 50% 30%, #1a1a1a, #0a0a0a 70%);
  }
  .dollar {
    position: absolute;
    left: 0;
    right: 0;
    top: 90px;
    text-align: center;
    font: 300 600px/1 'Geist', sans-serif;
    color: #f2efe6;
  }
  .slider { position: absolute; left: 212px; right: 212px; top: 790px; }
  .rail, .fill { position: absolute; left: 0; top: -12px; height: 24px; border-radius: 12px; }
  .rail { right: 0; background: #2a2a2a; }
  .fill { width: 40%; background: #ff6b3d; }
  .dot, .thumb { position: absolute; border-radius: 50%; transform: translate(-50%, -50%); }
  .dot { width: 40px; height: 40px; background: #3a3a3a; }
  .dot.on { background: #ff6b3d; }
  .thumb { left: 40%; width: 128px; height: 128px; background: #ff6b3d; box-shadow: 0 0 0 30px #41241b; }
  /* The glow is the app's rgba(255, 107, 61, .18) made opaque, so the rail doesn't show through. */
</style>
</head>
<body>
  <div class="dollar">$</div>
  <div class="slider">
    <div class="rail"></div>
    <div class="fill"></div>
    <div class="dot on" style="left: 0%"></div>
    <div class="dot on" style="left: 20%"></div>
    <div class="dot" style="left: 60%"></div>
    <div class="dot" style="left: 80%"></div>
    <div class="dot" style="left: 100%"></div>
    <div class="thumb"></div>
  </div>
</body>
</html>
